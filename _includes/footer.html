<footer class="site-footer">
  {% if site.email != "" %}<span>{{ site.email }}</span>{% endif %}
  {% if site.linkedin != "" %}<a href="{{ site.linkedin }}">LinkedIn</a>{% endif %}
  {% if site.github_user != "" %}<a href="https://github.com/{{ site.github_user }}">GitHub</a>{% endif %}
  <span>Last updated {{ site.time | date: "%B %Y" }}</span>
</footer>
